name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  colcon:
    runs-on: ubuntu-latest
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # No LeapSDK or MoveIt here: leap_tracker is skipped and the bridge needs Servo only at runtime.
      - name: Install ROS dependencies
        run: |
          set -e
          sudo rosdep update
          sudo rosdep install --from-paths . --ignore-src --rosdistro jazzy -y

      # The validator is newer than Jazzy's package: pinned venv install, ROS paths unset.
      - name: Validate parameter configuration
        run: |
          set -e
          python3 -m venv /tmp/gpl-validate
          /tmp/gpl-validate/bin/pip install --no-deps \
            "git+https://github.com/ros-tooling/generate_parameter_library.git@3de05171627222370af8e760a3a6c3adc9dde54a#subdirectory=generate_parameter_library_py"
          env -u PYTHONPATH -u AMENT_PREFIX_PATH \
            /tmp/gpl-validate/bin/generate_parameter_library_validate \
            --param-definition leap_teleop_core/config/leap_tracker_parameters.yaml \
            --param-definition leap_teleop_core/config/leap_teleop_deadman_parameters.yaml \
            --param-definition leap_teleop_core/config/leap_teleop_supervisor_parameters.yaml \
            --param-definition leap_teleop_bridge/config/leap_moveit_servo_bridge_parameters.yaml \
            --config leap_teleop_bringup/config/example_arm.yaml \
            --strict

      - name: Build
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install

      - name: Test
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          colcon test

      - name: Test results
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          colcon test-result --verbose
