# Parameters of leap_gripper_bridge, enforced by the generated ParamListener.

leap_gripper_bridge:
  side:
    type: string
    default_value: right
    description: "Hand whose gripper/<side> the bridge follows: right | left."
    read_only: true
    validation:
      one_of<>: [["right", "left"]]
  command_topic:
    type: string
    default_value: "/gripper_controller/commands"
    description: "Command topic of a forward_command_controller with one gripper joint."
    read_only: true
    validation:
      not_empty<>: []
  open_position:
    type: double
    default_value: 0.0
    description: "Joint position at closure 0, fully open."
    read_only: false
  closed_position:
    type: double
    default_value: 1.0
    description: "Joint position at closure 1, fully closed."
    read_only: false
  max_velocity:
    type: double
    default_value: 0.5
    description: "Gripper velocity cap, in joint units per second. 0 means no limit."
    read_only: false
    validation:
      gt_eq<>: [0.0]
  publish_period:
    type: double
    default_value: 0.01
    description: "Time between commands while moving toward the target, in seconds."
    read_only: true
    validation:
      gt<>: [0.0]
      lt_eq<>: [0.1]
  dry_run:
    type: bool
    default_value: true
    description: "Log commands instead of publishing them. Overridden by the launch argument dry_run."
    read_only: true
