# Parameters of leap_moveit_servo_bridge, enforced by the generated ParamListener.

leap_moveit_servo_bridge:
  side:
    type: string
    default_value: right
    description: "Hand whose pose_delta/<side> the bridge follows, and whose command/<side> it publishes: right | left."
    read_only: true
    validation:
      one_of<>: [["right", "left"]]
  tool_frame:
    type: string
    default_value: tool0
    description: "TF frame of the TCP. Rotations pivot about it."
    read_only: true
    validation:
      not_empty<>: []
  planning_frame:
    type: string
    default_value: base_link
    description: "TF frame Servo expects twists in."
    read_only: true
    validation:
      not_empty<>: []
  cartesian_command_topic:
    type: string
    default_value: "/servo_node/delta_twist_cmds"
    description: "Servo's cartesian_command_in_topic."
    read_only: true
    validation:
      not_empty<>: []
  kp_linear:
    type: double
    default_value: 4.0
    description: "Gain for linear error, in 1/s."
    read_only: false
    validation:
      gt<>: [0.0]
      lt_eq<>: [50.0]
  kp_angular:
    type: double
    default_value: 4.0
    description: "Gain for angular error, in 1/s."
    read_only: false
    validation:
      gt<>: [0.0]
      lt_eq<>: [50.0]
  max_linear_velocity:
    type: double
    default_value: 0.2
    description: "Linear velocity cap, in m/s."
    read_only: false
    validation:
      gt<>: [0.0]
      lt_eq<>: [2.0]
  max_angular_velocity:
    type: double
    default_value: 0.5
    description: "Angular velocity cap, in rad/s."
    read_only: false
    validation:
      gt<>: [0.0]
      lt_eq<>: [3.0]
  publish_period:
    type: double
    default_value: 0.01
    description: "Time between twists, in seconds."
    read_only: true
    validation:
      gt<>: [0.0]
      lt_eq<>: [0.1]
  dry_run:
    type: bool
    default_value: true
    description: "Log commands instead of publishing them. Overridden by the launch argument dry_run."
    read_only: true
