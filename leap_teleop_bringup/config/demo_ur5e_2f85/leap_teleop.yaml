/**/leap_driver:
  ros__parameters:
    tracking_mode: desktop

/**/leap_teleop_deadman:
  ros__parameters:
    key: leftalt
    device: ""

/**/leap_teleop_mapper:
  ros__parameters:
    base_frame: base_link

    tracking_timeout: 0.15
    min_hand_age: 0.2
    hold_timeout: 2.0

    yaw: 0.0

    # Tuned to cover the UR5e's reach.
    translation_scale: 2.0
    rotation_scale: 1.5

    deadband_translation: 0.002
    deadband_rotation: 0.5
    deadband_hysteresis: 1.5
    filter_min_cutoff: 5.0
    filter_beta: 0.05

    pinch_closed_mm: 20.0
    pinch_open_mm: 70.0

    gripper_filter_min_cutoff: 1.0
    gripper_filter_beta: 1.0
    gripper_deadband: 0.02

/**/leap_moveit_servo_bridge:
  ros__parameters:
    tool_frame: gripper_tcp  # Between the finger pads.
    planning_frame: base_link
    cartesian_command_topic: /servo_node/delta_twist_cmds

    kp_linear: 4.0
    kp_angular: 4.0
    max_linear_velocity: 0.2
    max_angular_velocity: 0.6
    publish_period: 0.01

    dry_run: true

/**/leap_gripper_bridge:
  ros__parameters:
    command_topic: /gripper_controller/commands
    open_position: 0.0
    closed_position: 0.8 # The knuckle's upper limit in robotiq_description's URDF, in radians.
    max_velocity: 0.5
    publish_period: 0.01

    dry_run: true

/**/leap_teleop_viz:
  ros__parameters:
    base_frame: base_link
    tool_frame: gripper_tcp  # Matches the bridge's tool_frame.
    mapper_node: leap_teleop_mapper

    leap_operator_frame_offset: [0.0, 0.0, 0.0]

    linear_arrow_scale: 1.0
    angular_arrow_scale: 0.2
