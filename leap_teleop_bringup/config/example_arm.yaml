# Example configuration. Every value is the default; copy the file and change it for your robot.
# (dynamic) marks parameters that can be changed at runtime.

/**/leap_driver:
  ros__parameters:
    # Tracking mode requested from the service: desktop | head_mounted.
    tracking_mode: desktop

/**/leap_teleop_deadman:
  ros__parameters:
    # Key to authorize motion: a-z, 0-9, f1-f12, space, enter, tab, esc, backspace, delete,
    # insert, home, end, pageup, pagedown, up, down, left, right, capslock, and left or right
    # ctrl, shift, alt, meta (for example leftctrl).
    key: leftalt
    # Keyboard event device path, /dev/input/by-id/...-event-kbd. Empty listens on all keyboards.
    device: ""

/**/leap_teleop_mapper:
  ros__parameters:
    # TF frame of the deltas. yaw is relative to it.
    base_frame: base_link

    # Age after which a hand pose counts as lost, in seconds.
    tracking_timeout: 0.15
    # Continuous tracking needed before engaging, in seconds. 0 disables.
    min_hand_age: 0.2
    # Time in hold before idle, in seconds. 0 stays in hold.
    hold_timeout: 2.0

    # Yaw from the operator's forward axis to the robot's +x, in degrees.
    yaw: 0.0

    # Hand-to-tool translation ratio. (dynamic)
    translation_scale: 1.0
    # Hand-to-tool rotation ratio, applied to the hand rotation since the key press. (dynamic)
    rotation_scale: 1.0

    # Hand travel ignored at rest, in meters. (dynamic)
    deadband_translation: 0.002
    # Hand rotation ignored at rest, in degrees. (dynamic)
    deadband_rotation: 0.5
    # Factor needed to leave the deadband. (dynamic)
    deadband_hysteresis: 1.5
    # One-Euro filter cutoff at rest, in Hz. Lower is smoother but laggier. (dynamic)
    filter_min_cutoff: 5.0
    # One-Euro filter speed coefficient. Higher follows fast motion better. (dynamic)
    filter_beta: 0.05

    # Pinch distance at which the gripper target is fully closed, in mm. Below pinch_open_mm. (dynamic)
    pinch_closed_mm: 20.0
    # Pinch distance at which the gripper target is fully open, in mm. Above pinch_closed_mm. (dynamic)
    pinch_open_mm: 70.0

    # One-Euro filter cutoff at rest for the gripper closure, in Hz. (dynamic)
    gripper_filter_min_cutoff: 1.0
    # One-Euro filter speed coefficient for the gripper closure. (dynamic)
    gripper_filter_beta: 1.0
    # Closure change below which no new gripper target is published, 0 to 1. (dynamic)
    gripper_deadband: 0.02

/**/leap_moveit_servo_bridge:
  ros__parameters:
    # TF frame of the TCP. Rotations pivot about it.
    tool_frame: tool0
    # TF frame Servo expects twists in.
    planning_frame: base_link
    # Servo's cartesian_command_in_topic.
    cartesian_command_topic: /servo_node/delta_twist_cmds

    # Gain for linear error, in 1/s. (dynamic)
    kp_linear: 4.0
    # Gain for angular error, in 1/s. (dynamic)
    kp_angular: 4.0
    # Linear velocity cap, in m/s. (dynamic)
    max_linear_velocity: 0.2
    # Angular velocity cap, in rad/s. (dynamic)
    max_angular_velocity: 0.5

    # Time between twists, in seconds.
    publish_period: 0.01

    # Log commands instead of publishing them. Overridden by the launch argument dry_run.
    dry_run: true

/**/leap_gripper_bridge:
  ros__parameters:
    # Command topic of a forward_command_controller with one gripper joint.
    command_topic: /gripper_controller/commands
    # Joint position at closure 0, fully open. (dynamic)
    open_position: 0.0
    # Joint position at closure 1, fully closed. (dynamic)
    closed_position: 1.0

    # Log commands instead of publishing them. Overridden by the launch argument dry_run.
    dry_run: true

/**/leap_teleop_viz:
  ros__parameters:
    # TF frame of the markers. Must match the mapper's base_frame.
    base_frame: base_link
    # TF frame of the TCP. Must match the bridge's tool_frame.
    tool_frame: tool0
    # Mapper node to read the scales from, relative to this node's namespace.
    mapper_node: leap_teleop_mapper

    # Position of leap_operator_frame in base_frame, x y z in meters. Display only.
    leap_operator_frame_offset: [0.0, 0.0, 0.0]

    # Length of the linear twist arrow, in m per m/s. (dynamic)
    linear_arrow_scale: 1.0
    # Length of the angular twist arrow, in m per rad/s. (dynamic)
    angular_arrow_scale: 0.2
