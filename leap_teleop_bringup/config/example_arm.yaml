# leap_teleop example configuration.
#
# Every value below is an example and also the declared default. Change it for your robot.
# Types, constraints and defaults come from the parameter definition files in each node
# package; CI checks this file with generate_parameter_library_validate --strict.
# Ranges: [a, b] inclusive, (a, b] or [a, b) exclusive at one end.
# Parameters marked "Dynamic" accept ros2 param set while the node runs. All others are
# read-only at runtime and require a restart; use ros2 param describe to see which is which.
#
# Cross-node requirements, documented here but enforced by no single node:
#   supervisor.heartbeat_rate  >  1 / bridge.command_timeout
#   supervisor.engage_timeout  >= 3 / deadman.publish_rate
#   bridge.command_timeout     <= Servo's incoming_command_timeout (default 0.1 s)
#   tracker.yaw must match the orientation of supervisor.base_frame

leap_tracker:
  ros__parameters:
    # Device mount relative to the operator. Choices: desktop | head_mounted.
    mount_mode: desktop
    # Hand used for teleoperation. Choices: right | left.
    side: right

    # Yaw from device forward axis to robot +x, degrees, range [-180, 180].
    yaw: 0.0

    # Hand-to-tool travel scale, unitless, range (0, 10]. Dynamic.
    translation_scale: 1.0
    # Hand-to-tool rotation scale, unitless, range (0, 10]. Dynamic.
    rotation_scale: 1.0

    # Hand travel ignored before motion starts, metres, range [0, 0.05]. Dynamic.
    deadband_translation: 0.002
    # Hand rotation ignored before motion starts, degrees, range [0, 5]. Dynamic.
    deadband_rotation: 0.5
    # Multiplier needed to leave the deadband, unitless, range [1, 4]. Dynamic.
    deadband_hysteresis: 1.5

    # One-Euro cutoff at rest, Hz, range (0, 100]. Lower is smoother and laggier. Dynamic.
    filter_min_cutoff: 1.0
    # One-Euro speed coefficient, unitless, range [0, 1]. Higher follows fast motion. Dynamic.
    filter_beta: 0.05

leap_teleop_deadman:
  ros__parameters:
    # Key held to authorise motion. Write the evdev name in lowercase with the KEY_ prefix
    # removed: KEY_RIGHTCTRL -> rightctrl, KEY_SPACE -> space, KEY_F1 -> f1. Letters a-z and
    # digits 0-9 are written as themselves. Only names in build_key_map() in
    # leap_teleop_core/src/keyboard_deadman.cpp are accepted; an unknown name stops startup.
    # Full KEY_* list:
    # https://github.com/torvalds/linux/blob/master/include/uapi/linux/input-event-codes.h
    key: space
    # Keyboard event device path, or empty to auto-detect. String.
    device: ""
    # Deadman broadcast rate, Hz, range [5, 100]. At least 3 periods per engage_timeout.
    publish_rate: 20.0

leap_teleop_supervisor:
  ros__parameters:
    # Frame for TeleopDelta and the bridge's tool-pose latch. TF frame, non-empty.
    base_frame: base_link
    # Rotation delta composition order. Choices: world | tool.
    rotation_frame: world

    # Maximum age of a hand pose, seconds, range (0, 1]. Older poses force HOLD.
    tracking_timeout: 0.15
    # Continuous tracking before latch, seconds, range [0, 5]. 0 disables.
    min_hand_age: 0.2
    # Time in HOLD before IDLE, seconds, range [0, 60]. 0 keeps HOLD.
    hold_timeout: 2.0
    # Minimum TeleopDelta rate, Hz, range [5, 100]. Must exceed 1 / command_timeout.
    heartbeat_rate: 20.0
    # Validity of a deadman message, seconds, range (0, 1]. At least 3 / publish_rate.
    engage_timeout: 0.15

leap_moveit_servo_bridge:
  ros__parameters:
    # Rotation pivot, TF frame, non-empty, may differ from the IK link.
    tool_frame: tool0
    # Frame for Servo twists, TF frame, non-empty.
    planning_frame: base_link
    # Servo cartesian input, topic, non-empty, must match cartesian_command_in_topic.
    cartesian_command_topic: /servo_node/delta_twist_cmds

    # Translation pose-error gain, 1/s, range (0, 50]. Saturates at the velocity cap. Dynamic.
    kp_linear: 4.0
    # Rotation pose-error gain, 1/s, range (0, 50]. Saturates at the velocity cap. Dynamic.
    kp_angular: 4.0
    # Hard cap on linear velocity, m/s, range (0, 2]. Dynamic.
    max_linear_velocity: 0.2
    # Hard cap on angular velocity, rad/s, range (0, 3]. Dynamic.
    max_angular_velocity: 0.5

    # Time without a fresh delta, seconds, range (0, 1]. At or below Servo's timeout.
    command_timeout: 0.09
    # Control tick period, seconds, range (0, 0.1].
    publish_period: 0.01

    # dry_run is launch-only: read-only at runtime and deliberately absent from this file.
    # ros2 launch leap_teleop_bringup teleop.launch.py dry_run:=false
