# Parameters of leap_driver, enforced by the generated ParamListener.

leap_driver:
  mount_mode:
    type: string
    default_value: desktop
    description: "Device mounting: desktop | head_mounted."
    read_only: true
    validation:
      one_of<>: [["desktop", "head_mounted"]]
  deadband_translation:
    type: double
    default_value: 0.002
    description: "Hand travel ignored at rest, in meters."
    read_only: false
    validation:
      bounds<>: [0.0, 0.05]
  deadband_rotation:
    type: double
    default_value: 0.5
    description: "Hand rotation ignored at rest, in degrees."
    read_only: false
    validation:
      bounds<>: [0.0, 5.0]
  deadband_hysteresis:
    type: double
    default_value: 1.5
    description: "Factor needed to leave the deadband."
    read_only: false
    validation:
      bounds<>: [1.0, 4.0]
  filter_min_cutoff:
    type: double
    default_value: 1.0
    description: "One-Euro filter cutoff at rest, in Hz. Lower is smoother but laggier."
    read_only: false
    validation:
      gt<>: [0.0]
      lt_eq<>: [100.0]
  filter_beta:
    type: double
    default_value: 0.05
    description: "One-Euro filter speed coefficient. Higher follows fast motion better."
    read_only: false
    validation:
      bounds<>: [0.0, 1.0]
