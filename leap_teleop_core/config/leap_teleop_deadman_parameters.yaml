# Parameters of leap_teleop_deadman, enforced by the generated ParamListener.

leap_teleop_deadman:
  key:
    type: string
    default_value: space
    description: "Key to authorize motion: a-z, 0-9, f1-f12, space, enter, tab, esc, backspace, delete, insert, home, end, pageup, pagedown, up, down, left, right, capslock, and left or right ctrl, shift, alt, meta (for example leftctrl)."
    read_only: true
    validation:
      not_empty<>: []
  device:
    type: string
    default_value: ""
    description: "Keyboard event device path, /dev/input/by-id/...-event-kbd. Empty picks the first keyboard."
    read_only: true
