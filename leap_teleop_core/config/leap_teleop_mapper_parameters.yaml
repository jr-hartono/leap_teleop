# Parameters of leap_teleop_mapper, enforced by the generated ParamListener.

leap_teleop_mapper:
  base_frame:
    type: string
    default_value: base_link
    description: "TF frame of the deltas. yaw is relative to it."
    read_only: true
    validation:
      not_empty<>: []
  tracking_timeout:
    type: double
    default_value: 0.15
    description: "Age after which a hand pose counts as lost, in seconds."
    read_only: true
    validation:
      gt<>: [0.0]
      lt_eq<>: [1.0]
  min_hand_age:
    type: double
    default_value: 0.2
    description: "Continuous tracking needed before engaging, in seconds. 0 disables."
    read_only: true
    validation:
      bounds<>: [0.0, 5.0]
  hold_timeout:
    type: double
    default_value: 2.0
    description: "Time in hold before idle, in seconds. 0 stays in hold."
    read_only: true
    validation:
      bounds<>: [0.0, 60.0]
  side:
    type: string
    default_value: right
    description: "Hand used for teleoperation: right | left."
    read_only: true
    validation:
      one_of<>: [["right", "left"]]
  yaw:
    type: double
    default_value: 0.0
    description: "Yaw from the operator's forward axis to the robot's +x, in degrees."
    read_only: true
    validation:
      bounds<>: [-180.0, 180.0]
  translation_scale:
    type: double
    default_value: 1.0
    description: "Hand-to-tool translation ratio."
    read_only: false
    validation:
      gt<>: [0.0]
      lt_eq<>: [10.0]
  rotation_scale:
    type: double
    default_value: 1.0
    description: "Hand-to-tool rotation ratio, applied by the mapper to the hand rotation since the key press."
    read_only: false
    validation:
      gt<>: [0.0]
      lt_eq<>: [10.0]
  deadband_translation:
    type: double
    default_value: 0.002
    description: "Hand travel ignored at rest, in meters."
    read_only: false
    validation:
      bounds<>: [0.0, 0.05]
  deadband_rotation:
    type: double
    default_value: 0.5
    description: "Hand rotation ignored at rest, in degrees."
    read_only: false
    validation:
      bounds<>: [0.0, 5.0]
  deadband_hysteresis:
    type: double
    default_value: 1.5
    description: "Factor needed to leave the deadband."
    read_only: false
    validation:
      bounds<>: [1.0, 4.0]
  filter_min_cutoff:
    type: double
    default_value: 1.0
    description: "One-Euro filter cutoff at rest, in Hz. Lower is smoother but laggier."
    read_only: false
    validation:
      gt<>: [0.0]
      lt_eq<>: [100.0]
  filter_beta:
    type: double
    default_value: 0.05
    description: "One-Euro filter speed coefficient. Higher follows fast motion better."
    read_only: false
    validation:
      bounds<>: [0.0, 1.0]
  pinch_closed_mm:
    type: double
    default_value: 20.0
    description: "Pinch distance, index fingertip to thumb, at which the gripper target is fully closed, in mm. Must be below pinch_open_mm."
    read_only: false
    validation:
      gt<>: [0.0]
  pinch_open_mm:
    type: double
    default_value: 70.0
    description: "Pinch distance, index fingertip to thumb, at which the gripper target is fully open, in mm. Must be above pinch_closed_mm."
    read_only: false
    validation:
      gt<>: [0.0]
  gripper_filter_min_cutoff:
    type: double
    default_value: 1.0
    description: "One-Euro filter cutoff at rest for the gripper closure, in Hz. Lower is smoother but laggier."
    read_only: false
    validation:
      gt<>: [0.0]
      lt_eq<>: [100.0]
  gripper_filter_beta:
    type: double
    default_value: 1.0
    description: "One-Euro filter speed coefficient for the gripper closure. Higher follows fast pinching better."
    read_only: false
    validation:
      gt_eq<>: [0.0]
  gripper_deadband:
    type: double
    default_value: 0.02
    description: "Closure change below which no new gripper target is published, from 0 to 1. The fully open and closed ends are always published."
    read_only: false
    validation:
      gt_eq<>: [0.0]
      lt<>: [1.0]
