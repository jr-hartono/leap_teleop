# Parameters of leap_teleop_supervisor, enforced by the generated ParamListener.

leap_teleop_supervisor:
  base_frame:
    type: string
    default_value: base_link
    description: "TF frame of the deltas. yaw is relative to it."
    read_only: true
    validation:
      not_empty<>: []
  rotation_frame:
    type: string
    default_value: world
    description: "Frame the rotation delta is composed in: world | tool."
    read_only: true
    validation:
      one_of<>: [["world", "tool"]]
  tracking_timeout:
    type: double
    default_value: 0.15
    description: "Age after which a hand pose counts as lost, in seconds."
    read_only: true
    validation:
      gt<>: [0.0]
      lt_eq<>: [1.0]
  min_hand_age:
    type: double
    default_value: 0.2
    description: "Continuous tracking needed before engaging, in seconds. 0 disables."
    read_only: true
    validation:
      bounds<>: [0.0, 5.0]
  hold_timeout:
    type: double
    default_value: 2.0
    description: "Time in hold before idle, in seconds. 0 stays in hold."
    read_only: true
    validation:
      bounds<>: [0.0, 60.0]
