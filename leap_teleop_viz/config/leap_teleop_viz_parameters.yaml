# Parameters of leap_teleop_viz, enforced by the generated ParamListener.

leap_teleop_viz:
  side:
    type: string
    default_value: right
    description: "Hand whose pose_delta/<side> and command/<side> are shown. Must match the mapper's side: right | left."
    read_only: true
    validation:
      one_of<>: [["right", "left"]]
  base_frame:
    type: string
    default_value: base_link
    description: "TF frame of the markers. Must match the mapper's base_frame."
    read_only: true
    validation:
      not_empty<>: []
  tool_frame:
    type: string
    default_value: tool0
    description: "TF frame of the TCP. Must match the bridge's tool_frame."
    read_only: true
    validation:
      not_empty<>: []
  mapper_node:
    type: string
    default_value: leap_teleop_mapper
    description: "Mapper node to read the scales from, relative to this node's namespace."
    read_only: true
    validation:
      not_empty<>: []
  linear_arrow_scale:
    type: double
    default_value: 1.0
    description: "Length of the linear twist arrow, in m per m/s."
    read_only: false
    validation:
      gt<>: [0.0]
      lt_eq<>: [10.0]
  angular_arrow_scale:
    type: double
    default_value: 0.2
    description: "Length of the angular twist arrow, in m per rad/s."
    read_only: false
    validation:
      gt<>: [0.0]
      lt_eq<>: [10.0]
  driver_node:
    type: string
    default_value: leap_driver
    description: "Driver node to read mount_mode from, relative to this node's namespace."
    read_only: true
    validation:
      not_empty<>: []
  leap_operator_frame_offset:
    type: double_array
    default_value: [0.0, 0.0, 0.0]
    description: "Position of leap_operator_frame in base_frame, x y z in meters. Display only."
    read_only: true
    validation:
      fixed_size<>: [3]
